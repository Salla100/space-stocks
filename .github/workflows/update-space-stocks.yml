name: Update space stocks

on:
  schedule:
    - cron: "45 17 * * 1-5"   # weekdays 17:45 UTC, after European close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python scripts/build_market.py
      - name: Commit if changed
        run: |
          git config user.name "space-stocks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update space stocks $(date -u +%F)"
          git push
